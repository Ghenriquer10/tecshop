<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TecShop{% endblock %}</title>
</head>
<body>
    <header>
        <nav>
            <a href="/">Início</a>
            {% if user.is_authenticated %}
                <a href="{% url 'account_logout' %}">Sair</a>
            {% else %}
                <a href="{% url 'account_login' %}">Entrar</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2025 TecShop</p>
    </footer>
</body>
</html>
